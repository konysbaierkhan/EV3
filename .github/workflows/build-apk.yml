name: Build EV3Controller Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Распаковка архива и сборка Debug APK
        run: |
          # 1. Распаковываем zip-архив
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Распаковка архива $z..."
              unzip -q -o "$z"
            fi
          done

          # 2. Находим папку с Android-проектом
          APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ОШИБКА: Папка app не найдена!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")
          cd "$PROJECT_DIR"

          # 3. Авто-исправление ресурса цвета иконки ic_launcher_background
          mkdir -p app/src/main/res/values
          if ! grep -rq "ic_launcher_background" app/src/main/res/values/; then
            cat << 'EOF' > app/src/main/res/values/ic_launcher_background.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#0F172A</color>
          </resources>
          EOF
          fi

          # 4. Авто-исправление outlinedButtonBorder в ControlScreen.kt
          python3 - << 'PYEOF'
          import glob, re

          for path in glob.glob("app/src/main/java/**/ControlScreen.kt", recursive=True):
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()

              target = "ButtonDefaults.outlinedButtonBorder"
              result = []
              i = 0
              while i < len(content):
                  idx = content.find(target, i)
                  if idx == -1:
                      result.append(content[i:])
                      break
                  result.append(content[i:idx])
                  result.append(target)
                  pos = idx + len(target)
                  # Пропускаем вызов скобок (...) и .copy(...) после outlinedButtonBorder
                  while True:
                      m = re.match(r'\s*(?:\.copy\s*)?\(', content[pos:])
                      if not m:
                          break
                      pos += m.end()
                      depth = 1
                      while pos < len(content) and depth > 0:
                          if content[pos] == '(':
                              depth += 1
                          elif content[pos] == ')':
                              depth -= 1
                          pos += 1
                  i = pos

              with open(path, "w", encoding="utf-8") as f:
                  f.write("".join(result))
              print(f"Исправлен файл: {path}")
          PYEOF

          # 5. Запускаем сборку APK
          gradle assembleDebug --no-daemon --stacktrace

          # 6. Копируем готовый APK для скачивания
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/EV3Controller.apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/app-debug.apk"

      - name: Загрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EV3Controller-Pro-APK
          path: |
            dist/EV3Controller.apk
            dist/app-debug.apk
          if-no-files-found: error
          retention-days: 90
