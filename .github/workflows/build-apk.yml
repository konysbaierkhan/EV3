name: Build EV3Controller Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle 8.7 (работает даже без файла gradlew)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Поиск проекта и сборка Debug APK
        run: |
          # 1. Если в репозиторий загружен zip-архив, автоматически распаковываем его
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Распаковка архива $z..."
              unzip -q -o "$z"
            fi
          done

          # 2. Ищем папку, в которой лежит Android-проект (папка app)
          APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ОШИБКА: Папка 'app' не найдена в репозитории! Загрузите EV3Controller-Pro.zip во вкладку Code."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "Переход в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # 3. Запускаем сборку напрямую через установленный Gradle 8.7
          gradle assembleDebug --no-daemon --stacktrace

          # 4. Собираем готовый APK в папку dist в корне
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/EV3Controller.apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/app-debug.apk"

      - name: Загрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EV3Controller-Pro-APK
          path: |
            dist/EV3Controller.apk
            dist/app-debug.apk
          if-no-files-found: error
          retention-days: 90
