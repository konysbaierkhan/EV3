name: Build EV3Controller Pro APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Сборка Android APK (Debug)
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание исходного кода
        uses: actions/checkout@v4

      - name: Установка JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Установка Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Распаковка архива и сборка Debug APK
        run: |
          # Распаковываем zip-архив, если проект загружен архивом
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "Распаковка архива $z..."
              unzip -q -o "$z"
            fi
          done

          # Ищем папку с Android-проектом (где лежит папка app)
          APP_DIR=$(find . -maxdepth 3 -type d -name "app" | head -n 1)
          if [ -z "$APP_DIR" ]; then
            echo "ОШИБКА: В репозитории нет папки app и нет архива EV3Controller-Pro.zip!"
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$APP_DIR")
          echo "Переход в папку проекта: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Запускаем сборку APK напрямую через установленный Gradle
          gradle assembleDebug --no-daemon --stacktrace

          # Копируем готовый APK для скачивания
          mkdir -p "$GITHUB_WORKSPACE/dist"
          APK_FILE=$(find . -name "app-debug.apk" | head -n 1)
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/EV3Controller.apk"
          cp "$APK_FILE" "$GITHUB_WORKSPACE/dist/app-debug.apk"

      - name: Загрузка готового APK в Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EV3Controller-Pro-APK
          path: |
            dist/EV3Controller.apk
            dist/app-debug.apk
          if-no-files-found: error
          retention-days: 90
